unit: auth-api
bindings:
  - type: route-declaration
    name: "POST /auth/login"
    source_loc: "backend/app/api/routes_auth.py:34"
    target: "login"
    must_appear_in_target: true
  - type: route-declaration
    name: "GET /auth/me"
    source_loc: "backend/app/api/routes_auth.py:59"
    target: "get_my_profile"
    must_appear_in_target: true
runtime_config:
  - key: "JWT_EXPIRE_MINUTES"
    source_loc: "backend/app/core/auth.py:1"
    source: env
    default_value: "480"
    must_appear_in_target: true
    notes: "Controls access-token lifetime."
