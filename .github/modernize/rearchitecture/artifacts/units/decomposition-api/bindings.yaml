unit: decomposition-api
bindings:
  - type: route-declaration
    name: "POST /projects/{id}/decompose and GET /projects/{id}/decomposition"
    source_loc: "backend/app/api/routes_decomp.py:23"
    target: "decomposition handlers"
    must_appear_in_target: true
runtime_config:
  - key: "DECOMP_WEIGHTS, DECOMP_GAMMA"
