# AcmeLIMS Legacy Configuration (Spring Boot 2.7.x)
server.port=8080
spring.application.name=acme-lims

# Database Configuration (Legacy Embedded H2 / Shared Schema)
spring.datasource.url=jdbc:h2:mem:acmelims;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Planted Issue 3: Hard-coded Admin Credentials (Security Finding)
acme.admin.username=limsadmin
acme.admin.password=SuperSecretAdmin123!

# Planted Issue 2: Local Windows File Share Path (Cloud Blocker)
instrument.import.directory=C:\\instrument\\import
instrument.backup.directory=C:\\instrument\\archive

# GxP Configuration
gxp.system.mode=PRODUCTION
gxp.part11.strict=true
